<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A 3D dorm room where the whiteboard runs the TU Delft AE selection-exam maths and physics drill.">
<title>Drill Dorm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600&family=Patrick+Hand&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%} body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: one full-screen GoldSrc-style room (pixelated WebGL) with a crisp DOM whiteboard placed in 3D on top, and an amber game HUD around the edges. Single deliberate dark look. */
:root {
  --void: #0b0d10;
  --hud: #ffad1f;
  --hud-dim: rgba(255, 173, 31, .55);
  --hud-bg: rgba(10, 8, 4, .42);
  --chat: #f2d94e;
  --good: #7ddc5a;
  --bad: #ff5c4a;
  --ink: #1f2c6e;
  --ink-red: #b8322a;
  --ink-green: #1d7a3b;
  --board: #f3f4ef;
  --font-hud: "Teko", "Arial Narrow", Impact, sans-serif;
  --font-marker: "Patrick Hand", "Comic Sans MS", "Segoe Print", cursive;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; background: var(--void); color: #e8e2d0; overflow: hidden; }
body { font: 14px/1.4 var(--font-ui); }
#stage { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
#css3d { position: absolute; inset: 0; pointer-events: none; }
#css3d * { pointer-events: none; }
#board2d { position: fixed; left: 0; top: 0; z-index: 2; transform-origin: 0 0; }
#board2d[hidden] { display: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--hud); outline-offset: 2px; }

/* Whiteboard (DOM in 3D) */
.board { position: relative; width: 1050px; height: 600px; box-sizing: border-box; padding: 30px 42px 26px; color: var(--ink); font-family: var(--font-marker); font-size: 24px; line-height: 1.3; overflow: hidden; display: flex; flex-direction: column; gap: 14px;
  background: radial-gradient(ellipse 260px 120px at 22% 78%, rgba(120,130,150,.10), transparent 70%), radial-gradient(ellipse 340px 90px at 74% 20%, rgba(120,130,150,.08), transparent 70%), radial-gradient(ellipse 200px 160px at 88% 86%, rgba(90,110,160,.07), transparent 70%), var(--board); }
.b-head { display: flex; gap: 14px; align-items: baseline; font-size: 19px; color: #5a6275; }
.b-head .code { color: var(--ink-red); font-size: 22px; }
.b-head .sp { flex: 1; }
.b-stem { font-size: 27px; line-height: 1.35; max-width: 960px; }
.b-stem code, .b-sol code { font-family: ui-monospace, Menlo, monospace; font-size: 18px; background: rgba(31,44,110,.07); padding: 0 4px; }
.b-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
.mk { background: transparent; border: 2.5px solid currentColor; border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px; padding: 8px 14px; text-align: left; color: var(--ink); display: flex; gap: 12px; align-items: center; min-height: 58px; font-family: var(--font-marker); font-size: 24px; }
.mk:hover { background: rgba(31,44,110,.06); }
.mk .key { font-size: 20px; width: 30px; height: 30px; flex: none; border: 2px solid currentColor; border-radius: 50%; display: grid; place-items: center; }
.mk .txt { min-width: 0; overflow-x: auto; overflow-y: hidden; }
.mk.right { color: var(--ink-green); border-width: 3.5px; }
.mk.wrong { color: var(--ink-red); }
.mk.wrong .txt { text-decoration: line-through; text-decoration-thickness: 2px; }
.mk[disabled] { cursor: default; }
.mk[disabled]:hover { background: transparent; }
.b-split { display: grid; grid-template-columns: 1fr 1.05fr; gap: 26px; flex: 1; min-height: 0; }
.b-split .b-stem { font-size: 21px; }
.b-split .b-choices { grid-template-columns: 1fr; gap: 7px; margin-top: 10px; }
.b-split .mk { min-height: 0; padding: 4px 12px; font-size: 19px; }
.b-split .mk .key { width: 24px; height: 24px; font-size: 16px; }
.b-right { display: flex; flex-direction: column; min-height: 0; border-left: 2px dashed rgba(31,44,110,.25); padding-left: 24px; }
.b-verdict { font-size: 30px; }
.b-verdict.ok { color: var(--ink-green); }
.b-verdict.no { color: var(--ink-red); }
.b-verdict small { font-size: 19px; color: #5a6275; }
.b-sol { font-size: 19px; line-height: 1.45; overflow-y: auto; flex: 1; min-height: 0; padding-right: 6px; color: #262b3a; }
.b-rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
.b-rate .mk { flex-direction: column; gap: 0; justify-content: center; align-items: center; min-height: 0; padding: 4px 6px; font-size: 22px; }
.b-rate .mk small { font-size: 16px; opacity: .75; }
.b-rate .again { color: var(--ink-red); }
.b-rate .good { color: var(--ink-green); }
.b-rate .easy { color: #1b5fa8; }
.b-rate .mk.default { border-width: 4px; background: rgba(31,44,110,.06); }
.b-title { font-size: 50px; line-height: 1; }
.b-note { position: absolute; right: 54px; top: 34px; transform: rotate(4deg); color: var(--ink-red); font-size: 26px; text-align: center; border: 3px solid currentColor; border-radius: 50%; padding: 14px 22px; }
.b-decks { display: flex; flex-direction: column; gap: 12px; max-width: 640px; margin-top: 6px; }
.b-decks .mk { justify-content: space-between; font-size: 27px; }
.b-decks .mk small { font-size: 20px; color: #5a6275; }
.b-hint { margin-top: auto; font-size: 19px; color: #6a7183; }
.b-hint kbd { font-family: var(--font-marker); border: 1.5px solid currentColor; border-radius: 4px; padding: 0 5px; }
.b-done { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
/* Portrait phones: the close-up becomes a tall board that fills the screen width */
.board.portrait { width: 540px; padding: 22px 22px 18px; font-size: 22px; overflow-y: auto; }
.board.portrait .b-head { flex-wrap: wrap; font-size: 16px; gap: 4px 10px; }
.board.portrait .b-stem { font-size: 24px; }
.board.portrait .b-choices { grid-template-columns: 1fr; }
.board.portrait .b-split { grid-template-columns: 1fr; gap: 14px; overflow: visible; }
.board.portrait .b-split > div:first-child { overflow: visible !important; }
.board.portrait .b-right { border-left: 0; padding-left: 0; border-top: 2px dashed rgba(31,44,110,.25); padding-top: 12px; }
.board.portrait .b-sol { overflow: visible; }
.board.portrait .b-note { position: static; transform: none; align-self: flex-start; font-size: 20px; padding: 8px 14px; }
.board.portrait .b-title { font-size: 38px; }
.board.portrait .b-decks .mk { font-size: 23px; }

/* HUD */
.hud { position: fixed; z-index: 3; pointer-events: none; font-family: var(--font-hud); color: var(--hud); text-shadow: 0 0 1px rgba(0,0,0,.6); }
#hud-bl { left: 18px; bottom: 10px; display: flex; gap: 26px; align-items: flex-end; }
#hud-c { left: 50%; bottom: 10px; transform: translateX(-50%); }
#hud-br { right: 18px; bottom: 10px; display: flex; gap: 12px; align-items: flex-end; }
.hv { display: flex; align-items: flex-end; gap: 8px; line-height: .8; }
.hv .ico { font-size: 34px; opacity: .85; }
.hv .num { font-size: 52px; font-weight: 500; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.hv .lab { font-size: 16px; letter-spacing: .12em; color: var(--hud-dim); margin-bottom: 6px; }
.hv.warn .num { color: var(--bad); }
.hsep { width: 3px; height: 40px; background: var(--hud-dim); margin: 0 4px 4px; }
#killfeed { position: fixed; z-index: 3; right: 14px; top: 56px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; pointer-events: none; }
.kf { font: 500 14px/1 var(--font-ui); background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 3px; display: flex; gap: 8px; align-items: center; transition: opacity .6s; }
.kf .you { color: #a8c8ff; }
.kf .ok { color: var(--good); font-weight: 700; }
.kf .no { color: var(--bad); font-weight: 700; }
.kf .t { color: #c8c2b0; }
#chat { position: fixed; z-index: 3; left: 16px; bottom: 82px; font: 500 14px/1.45 var(--font-ui); color: var(--chat); text-shadow: 1px 1px 0 #000; pointer-events: none; max-width: min(520px, 80vw); }
#chat div { transition: opacity .8s; }
body.at-board #chat { opacity: 0; }
#chat .who { color: #9fd36a; }
#tip { position: fixed; z-index: 4; pointer-events: none; font: 500 13px var(--font-ui); background: rgba(0,0,0,.72); color: #f3e9cf; padding: 5px 9px; border-radius: 3px; transform: translate(14px, 14px); white-space: nowrap; }
#top { position: fixed; z-index: 4; left: 12px; top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.tbtn { font: 500 13px var(--font-ui); background: rgba(0,0,0,.55); border: 1px solid rgba(255,173,31,.35); color: #f3e9cf; padding: 6px 11px; border-radius: 3px; text-decoration: none; }
.tbtn:hover { border-color: var(--hud); color: #fff; }
#status { position: fixed; z-index: 4; right: 14px; top: 14px; font: 12px var(--font-ui); color: rgba(243,233,207,.6); }
#loading { position: fixed; inset: 0; z-index: 10; background: var(--void); display: grid; place-items: center; font: 15px ui-monospace, Menlo, monospace; color: var(--hud); }
#loading p { margin: 0; }
@media (max-width: 640px) {
  .hv .num { font-size: 38px; } .hv .ico { font-size: 26px; } #hud-bl { gap: 14px; } #chat { bottom: 64px; font-size: 12px; }
  #hud-c { bottom: auto; top: 50px; } #status { display: none; } #killfeed { top: 92px; }
}
@media (prefers-reduced-motion: reduce) { .kf, #chat div { transition: none; } }
</style>

</head>
<body>
<div id="stage"></div>
<div id="board2d" hidden></div>
<div id="top">
  <button class="tbtn" id="back" hidden>&larr; Step back <span style="opacity:.6">(Esc)</span></button>
  <a class="tbtn" href="index.html">2D mode</a>
  <button class="tbtn" id="retro" aria-pressed="true">Retro pixels: on</button>
</div>
<div id="status"></div>
<div id="killfeed"></div>
<div id="chat"></div>
<div id="tip" hidden></div>
<div class="hud" id="hud-bl">
  <div class="hv"><span class="ico">&#10010;</span><span class="num" id="h-due">0</span><span class="lab">DUE</span></div>
  <div class="hv"><span class="ico">&#9670;</span><span class="num" id="h-new">0</span><span class="lab">NEW</span></div>
</div>
<div class="hud" id="hud-c"><div class="hv" id="h-timer-wrap"><span class="ico">&#9719;</span><span class="num" id="h-timer">0:00</span></div></div>
<div class="hud" id="hud-br">
  <div class="hv"><span class="num" id="h-right">0</span></div><div class="hsep"></div>
  <div class="hv"><span class="num" id="h-done">0</span><span class="lab">ANSWERED</span></div>
</div>
<div id="loading"><p>Loading dorm&hellip;</p></div>

<script>
window.MathJax = {
  tex: { inlineMath: [["$", "$"]], displayMath: [["$$", "$$"]] },
  svg: { fontCache: "global" },
  options: { enableMenu: false },
  startup: { typeset: false, ready() { MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => { mjReady = true; typesetBoard(); }); } }
};
var mjReady = false;

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="problems-math.js" charset="utf-8"></script>
<script src="problems-physics.js" charset="utf-8"></script>
<script src="problems-math-2.js" charset="utf-8"></script>
<script src="problems-physics-2.js" charset="utf-8"></script>
<script src="core.js" charset="utf-8"></script>
<script>
"use strict";
/* ================= Renderer ================= */
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
renderer.domElement.id = "gl";
stage.appendChild(renderer.domElement);
const cssR = new THREE.CSS3DRenderer();
cssR.domElement.id = "css3d";
stage.appendChild(cssR.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const cssScene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 60);
let retro = true;
try { retro = localStorage.getItem("dorm-retro") !== "off"; } catch (e) {}

/* ================= Procedural textures (64px-class, nearest filtering) ================= */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function canvasTex(w, h, draw, seed = 1, wrap = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.imageSmoothingEnabled = false;
  draw(x, w, h, rng(seed));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapLinearFilter;
  t.encoding = THREE.sRGBEncoding;
  if (wrap) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.userData = { canvas: c, ctx: x };
  return t;
}
function grain(x, w, h, r, amt) {
  const d = x.getImageData(0, 0, w, h), a = d.data;
  for (let i = 0; i < a.length; i += 4) { const n = (r() - 0.5) * amt; a[i] += n; a[i + 1] += n; a[i + 2] += n; }
  x.putImageData(d, 0, 0);
}
const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;
const T = {};
T.cinder = canvasTex(64, 64, (x, w, h, r) => {
  x.fillStyle = "#857a66"; x.fillRect(0, 0, w, h);
  for (let row = 0; row < 4; row++) {
    const off = row % 2 ? 16 : 0, y = row * 16;
    for (let bx = -32; bx < 64; bx += 32) {
      const v = 186 + (r() * 16 - 8);
      x.fillStyle = rgb(v, v * 0.94, v * 0.8); x.fillRect(bx + off + 1, y + 1, 30, 14);
      x.fillStyle = "rgba(255,255,255,.13)"; x.fillRect(bx + off + 1, y + 1, 30, 1);
      x.fillStyle = "rgba(0,0,0,.14)"; x.fillRect(bx + off + 1, y + 14, 30, 1);
    }
  }
  for (let i = 0; i < 70; i++) { x.fillStyle = `rgba(60,50,35,${0.15 + r() * 0.2})`; x.fillRect(r() * w | 0, r() * h | 0, 1, 1); }
  grain(x, w, h, r, 16);
}, 7);
T.planks = canvasTex(64, 64, (x, w, h, r) => {
  const cols = [[122, 82, 50], [110, 74, 44], [133, 89, 58], [116, 78, 47]];
  for (let p = 0; p < 4; p++) {
    const c = cols[p], y = p * 16;
    x.fillStyle = rgb(...c); x.fillRect(0, y, w, 16);
    for (let k = 0; k < 7; k++) { x.fillStyle = `rgba(50,30,15,${0.12 + r() * 0.18})`; x.fillRect(0, y + 1 + (r() * 14 | 0), w, 1); }
    x.fillStyle = "#3a2615"; x.fillRect(0, y, w, 1); x.fillRect(r() * w | 0, y, 1, 16);
  }
  grain(x, w, h, r, 14);
}, 3);
T.ceiling = canvasTex(64, 64, (x, w, h, r) => {
  x.fillStyle = "#d4d0c3"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) { x.fillStyle = `rgba(90,85,70,${0.25 + r() * 0.3})`; x.fillRect(r() * w | 0, r() * h | 0, 1, 1); }
  x.fillStyle = "#99958a"; x.fillRect(0, 0, w, 1); x.fillRect(0, 0, 1, h);
  grain(x, w, h, r, 8);
}, 5);
T.wood = canvasTex(64, 64, (x, w, h, r) => {
  x.fillStyle = "#a7774a"; x.fillRect(0, 0, w, h);
  for (let k = 0; k < 22; k++) { const y = r() * h | 0; x.fillStyle = `rgba(80,45,20,${0.15 + r() * 0.2})`; for (let i = 0; i < w; i++) x.fillRect(i, y + Math.round(Math.sin(i / 7 + k) * 1.2), 1, 1); }
  grain(x, w, h, r, 12);
}, 11);
T.plaid = canvasTex(32, 32, (x, w, h, r) => {
  x.fillStyle = "#26365a"; x.fillRect(0, 0, w, h);
  x.fillStyle = "rgba(140,40,38,.8)"; x.fillRect(0, 4, w, 6); x.fillRect(0, 20, w, 6); x.fillRect(4, 0, 6, h); x.fillRect(20, 0, 6, h);
  x.fillStyle = "rgba(205,180,100,.7)"; x.fillRect(0, 15, w, 1); x.fillRect(15, 0, 1, h);
  grain(x, w, h, r, 14);
}, 13);
T.fabric = canvasTex(32, 32, (x, w, h, r) => { x.fillStyle = "#d6d1c1"; x.fillRect(0, 0, w, h); grain(x, w, h, r, 16); }, 17);
T.seat = canvasTex(32, 32, (x, w, h, r) => { x.fillStyle = "#2d4366"; x.fillRect(0, 0, w, h); grain(x, w, h, r, 18); }, 19);
T.metal = canvasTex(32, 32, (x, w, h, r) => {
  x.fillStyle = "#8c9196"; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 12; i++) { x.fillStyle = `rgba(255,255,255,${r() * 0.12})`; x.fillRect(r() * w | 0, 0, 1, h); }
  grain(x, w, h, r, 12);
}, 23);
T.dark = canvasTex(16, 16, (x, w, h, r) => { x.fillStyle = "#3c4044"; x.fillRect(0, 0, w, h); grain(x, w, h, r, 10); }, 29);
T.white = canvasTex(16, 16, (x, w, h, r) => { x.fillStyle = "#e9e9e4"; x.fillRect(0, 0, w, h); grain(x, w, h, r, 6); }, 31);
T.paint = canvasTex(16, 16, (x, w, h, r) => { x.fillStyle = "#e2ddd0"; x.fillRect(0, 0, w, h); grain(x, w, h, r, 10); }, 37);
T.rug = canvasTex(64, 48, (x, w, h, r) => {
  x.fillStyle = "#7a2e2a"; x.fillRect(0, 0, w, h);
  x.strokeStyle = "#3d2a22"; x.lineWidth = 4; x.strokeRect(2, 2, w - 4, h - 4);
  x.fillStyle = "#c2a36b";
  for (let i = 6; i < w - 6; i += 3) { x.fillRect(i, 6, 1, 1); x.fillRect(i, h - 7, 1, 1); }
  for (let j = 6; j < h - 6; j += 3) { x.fillRect(6, j, 1, 1); x.fillRect(w - 7, j, 1, 1); }
  x.beginPath(); x.moveTo(w / 2, 12); x.lineTo(w / 2 + 14, h / 2); x.lineTo(w / 2, h - 12); x.lineTo(w / 2 - 14, h / 2); x.closePath(); x.fill();
  x.fillStyle = "#7a2e2a"; x.beginPath(); x.moveTo(w / 2, 18); x.lineTo(w / 2 + 8, h / 2); x.lineTo(w / 2, h - 18); x.lineTo(w / 2 - 8, h / 2); x.closePath(); x.fill();
  grain(x, w, h, r, 20);
}, 41, false);
T.sky = canvasTex(128, 64, (x, w, h, r) => {
  const gr = x.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#5f8cc4"); gr.addColorStop(0.7, "#b9cfe3"); gr.addColorStop(1, "#d9e2e6");
  x.fillStyle = gr; x.fillRect(0, 0, w, h);
  x.fillStyle = "rgba(255,255,255,.85)";
  for (const [cx, cy, s] of [[20, 12, 9], [32, 10, 7], [70, 18, 10], [84, 15, 7], [108, 8, 6]]) { x.beginPath(); x.ellipse(cx, cy, s, s * 0.45, 0, 0, 7); x.fill(); }
  // distant sandstone rooftops
  let bx = 0;
  while (bx < w) { const bw = 8 + (r() * 16 | 0), bh = 6 + (r() * 14 | 0), v = 180 + r() * 30; x.fillStyle = rgb(v, v * 0.84, v * 0.6); x.fillRect(bx, h - bh, bw, bh); x.fillStyle = "rgba(60,40,20,.55)"; for (let k = 2; k < bw - 2; k += 4) if (r() > 0.4) x.fillRect(bx + k, h - bh + 3, 2, 2); bx += bw; }
  x.fillStyle = "#b39363"; x.fillRect(46, h - 26, 10, 26); x.beginPath(); x.arc(51, h - 26, 5, Math.PI, 0); x.fill();
  grain(x, w, h, r, 6);
}, 43, false);
T.cork = canvasTex(32, 32, (x, w, h, r) => { x.fillStyle = "#a57a4e"; x.fillRect(0, 0, w, h); for (let i = 0; i < 120; i++) { x.fillStyle = `rgba(${r() > 0.5 ? "60,35,15" : "220,180,130"},.35)`; x.fillRect(r() * w | 0, r() * h | 0, 1, 1); } }, 47);
T.books = canvasTex(64, 32, (x, w, h, r) => {
  const pal = ["#7d2a26", "#2b4a75", "#2f6b3e", "#b08a2e", "#4b3a63", "#8a8a80", "#1f1f24", "#a4512b"];

  if (name !== "board") hideOverlay();
  document.getElementById("back").hidden = name !== "board";
  document.body.classList.toggle("at-board", name === "board");
  hideTip();
  renderBoard();
}
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const mouse = { x: 0, y: 0 };
function updateCamera(now) {
  if (cam.to) {
    const k = Math.min(1, (now - cam.t0) / cam.dur), e = ease(k);
    cam.pos.lerpVectors(cam.from.pos, cam.to.pos, e); cam.look.lerpVectors(cam.from.look, cam.to.look, e);
    if (k >= 1) { cam.to = null; if (view === "board") showOverlay(); }
  }
  camera.position.copy(cam.pos);
  const look = cam.look.clone();
  if (view === "overview" && !cam.to) { look.x += mouse.x * 0.35; look.y += -mouse.y * 0.18; }
  camera.lookAt(look);
  cssCamera.position.copy(camera.position).multiplyScalar(K);
  cssCamera.quaternion.copy(camera.quaternion);
}

function boardRect() {
  const a = V3(BOARD.x - BOARD.w / 2, BOARD.y + BOARD.h / 2, BOARD.z).project(camera);
  const b = V3(BOARD.x + BOARD.w / 2, BOARD.y - BOARD.h / 2, BOARD.z).project(camera);
  return { x: (a.x + 1) / 2 * innerWidth, y: (1 - a.y) / 2 * innerHeight, w: (b.x - a.x) / 2 * innerWidth };
}
const isPortrait = () => innerWidth < 760 && innerHeight > innerWidth;
function placeOverlay() {
  if (isPortrait()) {
    const W = 540, sc = (innerWidth - 16) / W;
    boardEl.classList.add("portrait"); boardEl.style.height = Math.round((innerHeight - 130) / sc) + "px";
    board2d.style.transform = `translate(8px, 50px) scale(${sc})`;
    return;
  }
  boardEl.classList.remove("portrait"); boardEl.style.height = "";
  camera.updateMatrixWorld();
  const r = boardRect();
  board2d.style.transform = `translate(${r.x}px, ${r.y}px) scale(${r.w / PX})`;
}
function showOverlay() { placeOverlay(); board2d.hidden = false; boardObj.visible = false; }
function hideOverlay() { board2d.hidden = true; boardObj.visible = true; }

/* ================= Resize ================= */
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  cssCamera.aspect = w / h; cssCamera.updateProjectionMatrix();
  const s = retro ? Math.min(1, 480 / h) : Math.min(window.devicePixelRatio || 1, 2);
  renderer.setSize(Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)), false);
  renderer.domElement.style.width = w + "px"; renderer.domElement.style.height = h + "px";
  cssR.setSize(w, h);
  if (view === "overview" && !cam.to) { const p = overviewPose(); cam.pos.copy(p.pos); cam.look.copy(p.look); }
  if (view === "board") { const p = boardPose(); if (cam.to) cam.to = p; else { cam.pos.copy(p.pos); cam.look.copy(p.look); updateCamera(performance.now()); placeOverlay(); } }
}
addEventListener("resize", resize);
const retroBtn = document.getElementById("retro");
function setRetro(on) { retro = on; retroBtn.textContent = "Retro pixels: " + (on ? "on" : "off"); retroBtn.setAttribute("aria-pressed", on); try { localStorage.setItem("dorm-retro", on ? "on" : "off"); } catch (e) {} resize(); }
retroBtn.addEventListener("click", () => setRetro(!retro));
document.getElementById("back").addEventListener("click", () => moveTo("overview"));

/* ================= Picking ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tip = document.getElementById("tip");
function hideTip() { tip.hidden = true; renderer.domElement.style.cursor = ""; }
function pick(ev) {
  ndc.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(clickables, false)[0];
  return hit ? hit.object : null;
}
addEventListener("pointermove", ev => {
  mouse.x = ev.clientX / innerWidth * 2 - 1; mouse.y = ev.clientY / innerHeight * 2 - 1;
  if (ev.target !== renderer.domElement || view !== "overview") { if (ev.target === renderer.domElement) hideTip(); return; }
  const o = pick(ev);
  if (o) { tip.hidden = false; tip.textContent = o.userData.label; tip.style.left = ev.clientX + "px"; tip.style.top = ev.clientY + "px"; renderer.domElement.style.cursor = "pointer"; }
  else hideTip();
});
renderer.domElement.addEventListener("click", ev => {
  const o = pick(ev);
  if (!o) return;
  const a = o.userData.action;
  if (a === "board") moveTo("board");
  else if (a === "laptop") location.href = "index.html";
  else if (a === "calendar") { const d = Math.max(0, Math.ceil((EXAM_DATE - startOfDay()) / DAY)); chat("Calendar", d + " days until the selection exam on 11 March 2027."); }
  else if (a === "clock") chat("Clock", "It's " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + ". " + (S.day.reviewed ? S.day.reviewed + " cards done today." : "No cards done yet today."));
});

/* ================= HUD, kill feed, chat ================= */
const $ = id => document.getElementById(id);
function updateHUD() {
  const k = deckCounts(session ? session.deck : "all");
  $("h-due").textContent = k.due; $("h-new").textContent = Math.min(k.nw, newLeft());
  $("h-done").textContent = session ? session.done : S.day.reviewed;
  $("h-right").textContent = session ? session.right : "-";
}
function killfeed(ok, p, ms) {
  const el = document.createElement("div"); el.className = "kf";
  el.innerHTML = `<span class="you">You</span><span class="${ok ? "ok" : "no"}">${ok ? "&#10004;" : "&#10008;"}</span><span>${p.topic}&middot;${p.sub}</span><span class="t">${Math.round(ms / 1000)}s</span>`;
  const kfBox = $("killfeed"); kfBox.prepend(el);
  while (kfBox.children.length > 5) kfBox.lastChild.remove();
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 700); }, 6000);
}
function chat(who, text) {
  const el = document.createElement("div");
  el.innerHTML = `<span class="who"></span> `; el.querySelector(".who").textContent = who + ":"; el.appendChild(document.createTextNode(text));
  const box = $("chat"); box.appendChild(el);
  while (box.children.length > 5) box.firstChild.remove();
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 900); }, 11000);
}

/* ================= Study session on the board ================= */
let session = null;
function startSession(deck, cram) {
  session = { deck, cram: !!cram, done: 0, right: 0, streak: 0, cur: null };
  advance(); renderBoard(); updateHUD();
}
function advance() {
  const p = nextCard(session.deck, session.cur && session.cur.id, session.cram);
  session.cur = p ? { id: p.id, perm: shuffle(p.choices.map((_, i) => i)), start: performance.now(), picked: null, ms: 0 } : null;
}
function choiceBtns(p, perm, cur, small) {
  return perm.map((ci, k) => {
    let cls = "", mark = "";
    if (cur.picked !== null) { if (ci === p.answer) { cls = "right"; mark = " &#10004;"; } else if (ci === cur.picked) { cls = "wrong"; mark = " &#10008;"; } }
    return `<button class="mk ${cls}" data-choice="${ci}" ${cur.picked !== null ? "disabled" : ""}><span class="key">${"ABCDE"[k]}</span><span class="txt">${p.choices[ci]}</span>${mark}</button>`;
  }).join("");
}
function boardHead(p) {
  return `<div class="b-head"><span class="code">${p.topic}&middot;${p.sub}</span><span>${esc(TOPICS[p.topic])}</span><span class="sp"></span><span>${"&#9679;".repeat(p.difficulty)}${"&#9675;".repeat(3 - p.difficulty)}</span><span>modelled on ${esc(p.model)}</span><span>${p.calc ? "calculator" : "by hand"}</span></div>`;
}
function renderBoard() {
  const days = Math.max(0, Math.ceil((EXAM_DATE - startOfDay()) / DAY));
  let html = "";
  if (!session) {
    const deckRow = (deck, label) => { const k = deckCounts(deck); return `<button class="mk" data-deck="${deck}"><span>${label}</span><small>${k.due} due &middot; ${Math.min(k.nw, newLeft())} new</small></button>`; };
    html = `<div class="b-note">${days}<br><span style="font-size:18px">days to go!</span></div>
      <div class="b-title">Tonight's revision</div>
      <div style="font-size:22px;color:#5a6275">Pick a deck. Answer, read the solution, rate yourself.</div>
      <div class="b-decks">${deckRow("all", "Everything")}${deckRow("math", "Maths")}${deckRow("physics", "Physics")}</div>
      <div class="b-hint">${view === "board" ? "Keys: <kbd>A</kbd>&ndash;<kbd>D</kbd> to answer, <kbd>1</kbd>&ndash;<kbd>4</kbd> to rate, <kbd>Esc</kbd> to step back." : "Click the board to step closer."}</div>`;
  } else if (!session.cur) {
    html = `<div class="b-done"><div class="b-title">Board's clear!</div>
      <div style="font-size:24px">Nothing else is due in this deck right now. ${newLeft() === 0 ? "Today's new-card limit is reached." : ""}</div>
      <button class="mk" data-cram="1"><span>Practise this deck anyway</span></button>
      <button class="mk" data-end="1"><span>Wipe the board (pick another deck)</span></button></div>`;
  } else {
    const cur = session.cur, p = BY_ID.get(cur.id);
    if (cur.picked === null) {
      html = `${boardHead(p)}<div class="b-stem">${p.stem}</div>
        <div class="b-choices">${choiceBtns(p, cur.perm, cur)}</div>
        <div class="b-hint">${view === "board" ? "<kbd>A</kbd>&ndash;<kbd>" + "ABCDE"[p.choices.length - 1] + "</kbd> to answer &middot; <kbd>Esc</kbd> to step back" : "Click the board to step closer."}</div>`;
    } else {
      const ok = cur.picked === p.answer, def = ok ? (cur.ms <= TARGET * 1000 ? 3 : 2) : 1, c = cs(p.id);
      cur.def = def;
      const lab = [["Again", "again"], ["Hard", ""], ["Good", "good"], ["Easy", "easy"]];
      html = `${boardHead(p)}<div class="b-split">
        <div style="min-width:0;overflow:hidden"><div class="b-stem">${p.stem}</div><div class="b-choices">${choiceBtns(p, cur.perm, cur)}</div></div>
        <div class="b-right"><div class="b-verdict ${ok ? "ok" : "no"}">${ok ? "Correct!" : "Not quite."} <small>${Math.round(cur.ms / 1000)} s${cur.ms > TARGET * 1000 ? ", over exam pace" : ""}</small></div>
          <div class="b-sol">${relabel(p.solution, cur.perm)}</div>
          <div class="b-rate">${lab.map(([l, cl], i) => `<button class="mk ${cl} ${def === i + 1 ? "default" : ""}" data-rate="${i + 1}">${l}<small>${fmtIvl(schedule(c, i + 1))}</small></button>`).join("")}</div>
        </div></div>`;
    }
  }
  boardEl.innerHTML = html;
  board3d.innerHTML = html;
  typesetBoard();
}
function typesetBoard() {
  if (!mjReady || !window.MathJax || !MathJax.typesetPromise) return;
  try { MathJax.typesetClear([boardEl, board3d]); } catch (e) {}
  MathJax.typesetPromise([boardEl, board3d]).catch(() => {});
}
function answer(ci) {
  const cur = session && session.cur;
  if (!cur || cur.picked !== null) return;
  cur.picked = ci; cur.ms = performance.now() - cur.start;
  const p = BY_ID.get(cur.id), ok = ci === p.answer;
  const c = Object.assign({}, cs(p.id));
  c.seen = (c.seen || 0) + 1; c.right = (c.right || 0) + (ok ? 1 : 0); c.tsum = (c.tsum || 0) + Math.min(cur.ms, 600000);
  S.cards[p.id] = c; rollDay();
  S.history[todayKey()] = (S.history[todayKey()] || 0) + 1;
  session.done++; if (ok) { session.right++; session.streak++; } else session.streak = 0;
  save();
  killfeed(ok, p, cur.ms);
  if (session.streak === 5) chat("Roommate", "Five in a row. Keep it going.");
  else if (session.streak === 10) chat("Roommate", "Ten straight. You're on fire.");
  renderBoard(); updateHUD();
}
function rate(r) {
  const cur = session && session.cur;
  if (!cur || cur.picked === null) return;
  const before = cs(cur.id); rollDay();
  if (before.s === "new") S.day.newDone++;
  S.day.reviewed++;
  S.cards[cur.id] = schedule(before, r);
  save(); advance(); renderBoard(); updateHUD();
}
boardEl.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.deck) startSession(d.deck);
  else if (d.choice !== undefined) answer(+d.choice);
  else if (d.rate) rate(+d.rate);
  else if (d.cram) { session.cram = true; advance(); renderBoard(); }
  else if (d.end) { session = null; renderBoard(); updateHUD(); }
});
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape") { if (view === "board") moveTo("overview"); return; }
  if (view !== "board" || !session || !session.cur) return;
  const cur = session.cur, p = BY_ID.get(cur.id), k = e.key.toUpperCase();
  if (cur.picked === null) {
    let i = "ABCDE".indexOf(k); if (i < 0 && /^[1-5]$/.test(k)) i = +k - 1;
    if (i >= 0 && i < p.choices.length) { e.preventDefault(); answer(cur.perm[i]); }
  } else if (/^[1-4]$/.test(k)) { e.preventDefault(); rate(+k); }
  else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); rate(cur.def || 3); }
});

/* ================= Sync hooks, loop, boot ================= */
onSyncChange = mode => { $("status").textContent = mode === "account" ? "Saved to your account" : mode === "local" ? "Saved in this browser" : ""; };
onStateReplaced = () => { renderBoard(); updateHUD(); };
function tickTimer() {
  const el = $("h-timer"), wrap = $("h-timer-wrap");
  const cur = session && session.cur;
  const ms = !cur ? 0 : cur.picked !== null ? cur.ms : performance.now() - cur.start;
  const s = Math.floor(ms / 1000);
  el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  wrap.classList.toggle("warn", ms > TARGET * 1000);
}
let lastClock = 0;
function frame(now) {
  updateCamera(now);
  if (now - lastClock > 20000) { drawClock(); lastClock = now; }
  tickTimer();
  renderer.render(scene, camera);
  cssR.render(cssScene, cssCamera);
  requestAnimationFrame(frame);
}
drawCalendar(); drawClock();
setRetro(retro);
renderBoard(); updateHUD();
requestAnimationFrame(t => { frame(t); $("loading").remove(); });
const k0 = deckCounts("all");
setTimeout(() => chat("Roommate", `Board's clean. ${k0.due} due and ${Math.min(k0.nw, newLeft())} new cards tonight. Click the whiteboard to start.`), 600);
connect();
</script>
